spring:
  application:
    name: mealdeck-api
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
    openai:
      # A non-secret placeholder lets local mode boot without provider credentials.
      # The extraction service rejects requests until OPENAI_API_KEY is configured.
      api-key: ${OPENAI_API_KEY:not-configured}
      chat:
        options:
          model: ${OPENAI_MODEL:gpt-5.6-sol}
  datasource:
    url: jdbc:h2:file:./data/mealdeck;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
server:
  port: ${PORT:8080}
mealdeck:
  upload-dir: ${MEALDECK_UPLOAD_DIR:./data/uploads}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-5.6-sol}
